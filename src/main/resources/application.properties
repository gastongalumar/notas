# ====================
# APP CONFIGURATION
# ====================
spring.application.name=demoNotas
server.port=8080
server.servlet.context-path=/

# ====================
# DATABASE CONFIGURATION
# ====================
# CORREGIDO: notas_app (no notes_app)
spring.datasource.url=jdbc:mysql://localhost:3306/notasdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234wers
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================
# JPA / HIBERNATE CONFIGURATION
# ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# ====================
# LOGGING (opcional pero útil para debug)
# ====================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ====================
# DEVTOOLS (recarga automática en desarrollo)
# ====================
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true